# Local PostgreSQL for development. Credentials match the default DATABASE_URL.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: flowpocus
      POSTGRES_PASSWORD: flowpocus
      POSTGRES_DB: flowpocus
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpocus"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
