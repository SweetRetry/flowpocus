pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commit
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  parallel: true
  jobs:
    - name: knip
      run: pnpm knip
    - name: typecheck
      run: pnpm typecheck
